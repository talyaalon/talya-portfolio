         defaults, and they must match the default language, English. -->

    <meta
      name="description"
      content="How a multi-branch bilingual ordering platform for a 6-branch chain in Thailand was built: branch identity on the server, integrations with Odoo, Stripe and Shipday, and an in-house analytics module."

    <link rel="canonical" href="https://talya-portfolio.netlify.app/projects/j-cafe" />
    <meta name="theme-color" content="#b07a4e" />
    <meta name="author" content="Talya Israel" />

    <meta property="og:site_name" content="Talya Israel" />
    <meta property="og:title" content="J-Cafe Online - case study" />
